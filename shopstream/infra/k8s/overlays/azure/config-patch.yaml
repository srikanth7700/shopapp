apiVersion: v1
kind: ConfigMap
metadata:
  name: shopstream-config
data:
  # <server-name>.postgres.database.azure.com
  DB_HOST: "REPLACE_WITH_POSTGRES_HOST"
  DB_PARAMS: "?sslmode=require"
  # Event Hubs exposes a Kafka endpoint on port 9093 with SASL over TLS.
  KAFKA_BOOTSTRAP_SERVERS: "REPLACE_WITH_EVENTHUBS_NAMESPACE.servicebus.windows.net:9093"
  SPRING_KAFKA_PROPERTIES_SECURITY_PROTOCOL: "SASL_SSL"
  SPRING_KAFKA_PROPERTIES_SASL_MECHANISM: "PLAIN"
  # Event Hubs manages replication itself.
  APP_KAFKA_REPLICATIONFACTOR: "1"
