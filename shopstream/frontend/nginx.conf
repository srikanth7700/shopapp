server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API calls go to the gateway. "api-gateway" is the service name in both
    # docker-compose.yml and the Kubernetes manifests.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Built files have a content hash in their name, so they can be cached for a long time.
    location ~* \.(js|css|ico|png|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: unknown paths like /orders/12 are handled by the Angular router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
