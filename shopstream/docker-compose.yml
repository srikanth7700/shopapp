# ShopStream: the whole platform on your laptop.
#
#   docker compose up --build       build everything and start it (first run: 5-10 minutes)
#   docker compose ps               see what is running and healthy
#   docker compose logs -f order-service
#   docker compose down             stop (keeps the database volume)
#   docker compose down -v          stop and delete all data
#
# Open http://localhost:4200 when all services show "healthy".
#
# Only-infrastructure mode, for running the Java services from your IDE:
#   docker compose up -d postgres kafka kafka-ui adminer

name: shopstream

# YAML anchors (&name) and merges (<<: *name) avoid repeating the same settings.
x-java-service: &java-service
  restart: unless-stopped
  mem_limit: 512m
  build: &java-build
    context: .
    dockerfile: backend.Dockerfile

x-db-and-kafka-env: &db-and-kafka-env
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_USERNAME: ${POSTGRES_USER:-shopstream}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-shopstream}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092

x-depends-on-db-and-kafka: &depends-on-db-and-kafka
  postgres:
    condition: service_healthy
  kafka:
    condition: service_healthy

services:
  # ---------------------------------------------------------------- infrastructure

  postgres:
    image: postgres:16-alpine
    container_name: shopstream-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopstream}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopstream}
      POSTGRES_DB: shopstream
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts in this folder run once, when the data volume is first created.
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP, which only opens after the init script has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d notifications_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    # Kafka in KRaft mode: no ZooKeeper needed. One node is both broker and controller.
    image: apache/kafka:3.9.0
    container_name: shopstream-kafka
    hostname: kafka
    restart: unless-stopped
    mem_limit: 1g
    ports:
      # Containers use kafka:9092. Your IDE / host machine uses localhost:29092.
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  kafka-ui:
    # Browse topics, messages, consumer groups and lag: http://localhost:8090
    image: kafbat/kafka-ui:latest
    container_name: shopstream-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: shopstream
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  adminer:
    # Browse the databases: http://localhost:8091
    # System: PostgreSQL, Server: postgres, User/Password: shopstream, Database: orders_db (etc.)
    image: adminer:latest
    container_name: shopstream-adminer
    restart: unless-stopped
    ports:
      - "8091:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres

  # ---------------------------------------------------------------- microservices

  api-gateway:
    <<: *java-service
    build:
      <<: *java-build
      args:
        SERVICE: api-gateway
    image: shopstream/api-gateway:local
    container_name: shopstream-api-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-in-production-0123456789}
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8083
      ORDER_SERVICE_URL: http://order-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  user-service:
    <<: *java-service
    build:
      <<: *java-build
      args:
        SERVICE: user-service
    image: shopstream/user-service:local
    container_name: shopstream-user-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: ${POSTGRES_USER:-shopstream}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-shopstream}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-in-production-0123456789}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@shopstream.dev}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  product-service:
    <<: *java-service
    build:
      <<: *java-build
      args:
        SERVICE: product-service
    image: shopstream/product-service:local
    container_name: shopstream-product-service
    ports:
      - "8082:8082"
    environment:
      <<: *db-and-kafka-env
    depends_on: *depends-on-db-and-kafka
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  inventory-service:
    <<: *java-service
    build:
      <<: *java-build
      args:
        SERVICE: inventory-service
    image: shopstream/inventory-service:local
    container_name: shopstream-inventory-service
    ports:
      - "8083:8083"
    environment:
      <<: *db-and-kafka-env
    depends_on: *depends-on-db-and-kafka
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8083/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  order-service:
    <<: *java-service
    build:
      <<: *java-build
      args:
        SERVICE: order-service
    image: shopstream/order-service:local
    container_name: shopstream-order-service
    ports:
      - "8084:8084"
    environment:
      <<: *db-and-kafka-env
      PRODUCT_SERVICE_URL: http://product-service:8082
    depends_on: *depends-on-db-and-kafka
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8084/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  payment-service:
    <<: *java-service
    build:
      <<: *java-build
      args:
        SERVICE: payment-service
    image: shopstream/payment-service:local
    container_name: shopstream-payment-service
    ports:
      - "8085:8085"
    environment:
      <<: *db-and-kafka-env
      PAYMENT_MAX_AMOUNT: "5000"
      PAYMENT_DELAY_MS: "1500"
    depends_on: *depends-on-db-and-kafka
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8085/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  notification-service:
    <<: *java-service
    build:
      <<: *java-build
      args:
        SERVICE: notification-service
    image: shopstream/notification-service:local
    container_name: shopstream-notification-service
    ports:
      - "8086:8086"
    environment:
      <<: *db-and-kafka-env
    depends_on: *depends-on-db-and-kafka
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8086/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  # ---------------------------------------------------------------- frontend

  frontend:
    build:
      context: ./frontend
    image: shopstream/frontend:local
    container_name: shopstream-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - api-gateway

volumes:
  pgdata:
